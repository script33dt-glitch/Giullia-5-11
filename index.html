<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria de Fotos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      color: #333;
    }
    .galeria {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      width: 100%;
      max-width: 1200px;
      margin-top: 20px;
    }
    .galeria img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s;
    }
    .galeria img:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <h1>Minha Galeria</h1>

  <div class="galeria">
    <img src="foto1.png" alt="Foto 1">
    <img src="foto2.png" alt="Foto 2">
    <img src="foto3.png" alt="Foto 3">
    <img src="foto4.png" alt="Foto 4">
    <img src="foto5.png" alt="Foto 5">
    <img src="foto6.png" alt="Foto 6">
    <img src="foto7.png" alt="Foto 7">
    <img src="foto8.png" alt="Foto 8">
    <img src="foto9.png" alt="Foto 9">
    <img src="foto10.png" alt="Foto 10">
    <img src="foto11.png" alt="Foto 11">
    <img src="foto12.png" alt="Foto 12">
    <img src="foto13.png" alt="Foto 13">
    <img src="foto14.png" alt="Foto 14">
    <img src="foto15.png" alt="Foto 15">
    <img src="foto16.png" alt="Foto 16">
    <img src="foto17.png" alt="Foto 17">
    <img src="foto18.png" alt="Foto 18">
    <img src="foto19.png" alt="Foto 19">
    <img src="foto20.png" alt="Foto 20">
  </div>

</body>
</html>
